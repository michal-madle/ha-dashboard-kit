<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ha-dashboard-kit – climate</title>
  <style>html, body { margin: 0; background: #000; color: #fff; font: 17px/22px -apple-system, sans-serif; } main { padding: 16px; }</style>
</head>
<body>
  <main><h1 style="font-size:17px;margin:0 0 8px">Climate</h1><kit-sheet id="sheet" heading="Klimatizace" closeLabel="Zavřít" open><kit-climate id="climate"></kit-climate></kit-sheet></main>
  <script type="module">
    import { defineControls } from "/src/controls/index.ts";
    import { defineClimate } from "/src/climate/index.ts";
    import { getI18n } from "/src/i18n.ts";
    defineControls("kit");
    defineClimate("kit");
    const params = new URLSearchParams(location.search);
    const system = params.get("system") ?? "cooling";
    const ac = { hvac_modes: ["off", "cool", "dry", "fan_only", "heat", "auto"], preset_modes: ["none", "sleep", "wind_free"], fan_modes: ["auto", "low", "medium", "high", "turbo"], swing_modes: ["off", "both", "vertical", "horizontal"], fan_mode: "auto", swing_mode: "off", min_temp: 16, max_temp: 30 };
    const tado = { hvac_modes: ["off", "auto", "heat"], min_temp: 5, max_temp: 25 };
    const e = (state, attributes) => ({ state, attributes });
    const states = system === "cooling"
      ? { "climate.a": e("cool", { ...ac, temperature: 22, current_temperature: 23.4 }), "climate.b": e("cool", { ...ac, temperature: 24, preset_mode: "wind_free", current_temperature: 24.1 }), "climate.c": e("off", { ...ac, temperature: 22 }), "climate.d": e("off", { ...ac, temperature: 22 }) }
      : { "climate.a": e("auto", { ...tado, temperature: 21, current_temperature: 21.6 }), "climate.b": e("heat", { ...tado, temperature: 22.5, current_temperature: 21.6, hvac_action: "heating" }), "climate.c": e("off", { ...tado, temperature: 5 }) };
    window.calls = [];
    const hass = { states, services: params.get("notimer") ? {} : { tado_ce: { set_climate_timer: {} } }, callService: async (domain, service, data) => { window.calls.push({ domain, service, data }); }, callWS: async (message) => { window.calls.push({ ws: message }); } };
    const modes = { plan: "Plán", manual: "Ručně", boost: "Boost", off: "Vypnuto", cool: "Chlazení", wind_free: "WindFree", heat: "Topení", fan_only: "Větrání", dry: "Sušení", auto: "Auto", sleep: "Spánek" };
    const texts = {
      rooms: "Místnosti", temperature: "Cílová teplota", mode: "Režim", modes, unavailable: "Nedostupné",
      now: (parts) => `Teď ${parts}`, heats: "topí", targets: (parts) => `Cíl: ${parts}`, mixedModes: (parts) => `Různé režimy: ${parts}`,
      firstChange: "První změna nastaví všechny vybrané stejně.", manualFor: "Ručně platí", offFor: "Vypnuto platí",
      manualForChoices: { next: "Do plánu", 30: "30 min", 60: "1 h", 180: "3 h", forever: "Trvale" }, offAfter: "Vypnout za",
      offAfterChoices: { 0: "Nevypínat", 60: "1 h", 180: "3 h", 480: "8 h" },
      untilNextPlan: "Do další změny plánu, potom zpět na plán.", untilTime: (time) => `Do ${time}, potom zpět na plán.`, untilChanged: "Platí, dokud ho nezměníš.", offUntilNextPlan: "Vypnuto do další změny plánu, potom zpět na plán.", offUntilTime: (time) => `Vypnuto do ${time}, potom zpět na plán.`, offUntilChanged: "Vypnuto, dokud ho nezapneš.",
      runsUntilOff: "Běží, dokud ji nevypneš.", offAt: (time) => `Běží do ${time}, potom se vypne.`, fan: "Síla větru", swing: "Směr proudění", fanModes: { auto: "Auto", low: "Slabě", medium: "Středně", high: "Silně", turbo: "Turbo" }, swingModes: { off: "Pevně", both: "Všude", vertical: "Nahoru a dolů", horizontal: "Do stran" }, detail: "Detail a historie", sending: "Odesílá se", failed: "Nepodařilo se",
    };
    const climate = document.getElementById("climate");
    Object.assign(climate, { hass, i18n: getI18n({ cs: {}, en: {}, sv: {} }, "cs"), texts, system, delayMs: Number(params.get("delay") ?? 300),
      rooms: Object.keys(states).map((entity) => ({ name: { "climate.a": "Obývák", "climate.b": "Ložnice", "climate.c": "Maxík", "climate.d": "Mikuláš" }[entity], entity })),
      selected: (params.get("selected") ?? "climate.a").split(",") });
    window.climate = climate;
    document.addEventListener("hdk-more-info", (event) => window.calls.push({ moreInfo: event.detail.entityId }));
    window.ready = true;
  </script>
</body>
</html>
