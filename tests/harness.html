<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ha-dashboard-kit – controls</title>
  <style>
    html, body { margin: 0; background: #1c1c1e; color: #fff; font-family: -apple-system, "SF Pro Text", Roboto, sans-serif; }
    main { display: grid; gap: 28px; padding: 60px 16px 16px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    /* The tokens a card maps from its own colours (README.md, Ovládací prvky). */
    :root {
      --hdk-accent: #0a84ff;
      --hdk-switch-off: rgb(120 120 128 / 36%);
      --hdk-track: #2c2c2e;
      --hdk-track-compact: #3a3a3c;
      --hdk-bar: rgb(255 255 255 / 14%);
      --hdk-tick: rgb(255 255 255 / 28%);
      --hdk-secondary: #98989f;
      --hdk-seg-thumb: #ffffff;
      --hdk-seg-text: #ebebf5;
      --hdk-seg-selected: #000000;
      --hdk-bubble: #3a3a3c;
      --hdk-bubble-text: #ffffff;
      --hdk-ring-fill: #30d158;
    }
  </style>
</head>
<body>
  <main>
    <h1 style="position:absolute;top:8px;left:16px;margin:0;font-size:17px">Controls</h1>
    <div class="row"><span>Plain switch</span><kit-switch id="plain" label="Plain switch"></kit-switch></div>
    <div class="row"><span>Guarded switch</span><kit-switch id="guarded" label="Guarded switch" guarded hint="Hold or tap twice."></kit-switch></div>
    <kit-segmented id="seg" label="Mode" guarded value="a" hint="Hold, drag or tap twice."></kit-segmented>
    <kit-segmented id="free" label="Free mode" value="a"></kit-segmented>
    <div class="row"><span>Ring</span><kit-ring id="ring" fraction="0.5" num="50" unit="W" label="Half done"></kit-ring><kit-ring id="alone" fraction="0.62" num="62" label="Percent"></kit-ring><kit-ring id="bare" fraction="2" size="32" stroke="5" label="Full"></kit-ring></div>
    <kit-slider id="slider" label="Temperature" min="30" max="70" step="1" value="50" minLabel="30" maxLabel="70"></kit-slider>
    <div id="tiles" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#000;padding:8px;margin:0 -8px">
      <kit-tile id="t-fan" name="Koupelna přízemí" text="Vypnuto" state="off" guarded hint="Hold or tap twice." hintAlign="start"></kit-tile>
      <kit-tile id="t-on" name="Záchod patro" text="Běží 8 min" state="on" guarded hint="Hold or tap twice."></kit-tile>
      <kit-tile id="t-open" name="Obývák" text="Plán · 21°" state="idle" kind="open" guarded hintAlign="end"></kit-tile>
      <kit-tile id="t-preset" name="Den" state="mixed" kind="action" centered count="3" guarded hint="Hold or tap twice." hintAlign="start"></kit-tile>
      <kit-tile id="t-free" name="Stín" state="idle" kind="action" centered></kit-tile>
      <kit-tile id="t-dis" name="Tma" state="idle" kind="action" centered disabled></kit-tile>
    </div>
    <button id="open-sheet" type="button" style="min-height:44px">Open sheet</button>
    <kit-sheet id="sheet" heading="Žaluzie" sub="4 místnosti" closeLabel="Zavřít"><button id="in-a" type="button">A</button><kit-tile id="in-tile" name="Den" kind="action" centered></kit-tile></kit-sheet>
  </main>
  <script type="module">
    import { defineControls } from "/src/controls/index.ts";
    defineControls("kit");
    defineControls("kit");
    const options = [{ value: "a", label: "Surplus" }, { value: "b", label: "Boost" }];
    for (const id of ["seg", "free"]) document.getElementById(id).options = options;
    window.events = [];
    const sheet = document.getElementById("sheet");
    document.getElementById("open-sheet").addEventListener("click", () => (sheet.open = true));
    sheet.addEventListener("hdk-close", () => (sheet.open = false));
    for (const type of ["hdk-close", "hdk-toggle", "hdk-select", "hdk-change", "hdk-input", "hdk-press", "hdk-open"]) {
      document.addEventListener(type, (event) => window.events.push({ type, id: event.target.id, detail: event.detail }));
    }
    window.ready = true;
  </script>
</body>
</html>
